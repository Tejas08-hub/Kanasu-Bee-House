<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bee Assistant | Kanasu Bee House</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--primary:#f4b400;
--dark:#1e293b;
--light-bg:#fcfcf9;
--white:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:var(--light-bg);
color:var(--dark);
height:100vh;
height:100dvh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* NAVBAR */
nav{
padding:12px 5%;
background:var(--white);
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:1000;
flex-shrink:0;
}

.back-link{
text-decoration:none;
color:var(--dark);
font-weight:700;
font-size:14px;
}

/* OUTER WRAPPER */
.main-wrapper{
flex:1;
display:flex;
justify-content:center;
align-items:stretch;
padding:16px;
min-height:0;
}

/* CHAT WRAPPER WITH BORDER */
.chat-wrapper{
width:100%;
max-width:900px;
background:white;
border:3px solid #f4b400;
border-radius:20px;
box-shadow:0 15px 40px rgba(244,180,0,0.1);
display:flex;
flex-direction:column;
flex:1;
min-height:0;
overflow:hidden;
}

/* TITLE INSIDE BORDER */
.chat-title{
text-align:center;
font-weight:800;
font-size:16px;
padding:14px 18px;
border-bottom:1px solid #eee;
background:#fffdf5;
flex-shrink:0;
}

/* CHAT WINDOW */
#chat-window{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:14px;
min-height:0;
}

/* MESSAGES */
.msg{
max-width:78%;
padding:12px 15px;
border-radius:16px;
font-size:14px;
line-height:1.55;
opacity:0;
transform:translateY(10px);
animation:fadeIn 0.25s ease forwards;
word-break:break-word;
}

@keyframes fadeIn{
to{
opacity:1;
transform:translateY(0);
}
}

.user-msg{
align-self:flex-end;
background:var(--primary);
color:#000;
border-bottom-right-radius:4px;
}

.bot-msg{
align-self:flex-start;
background:#f8fafc;
border:1px solid #e2e8f0;
border-bottom-left-radius:4px;
}

/* Typing dots */
.typing-dots{
display:inline-flex;
gap:4px;
}

.typing-dots span{
width:6px;
height:6px;
background:#888;
border-radius:50%;
animation:blink 1.4s infinite both;
}

.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}

@keyframes blink{
0%{opacity:.2}
20%{opacity:1}
100%{opacity:.2}
}

/* INPUT BAR */
.input-container{
padding:12px;
background:var(--white);
border-top:1px solid #eee;
display:flex;
gap:8px;
flex-shrink:0;
}

#user-input{
flex:1;
padding:11px 13px;
border-radius:10px;
border:1px solid #e2e8f0;
font-size:14px;
min-width:0;
}

#user-input:focus{
outline:none;
border-color:var(--primary);
box-shadow:0 0 0 3px rgba(244,180,0,0.1);
}

#send-btn{
background:var(--primary);
border:none;
padding:11px 18px;
border-radius:10px;
font-weight:700;
cursor:pointer;
font-size:14px;
flex-shrink:0;
}

/* MOBILE */
@media(max-width:600px){
body{
height:100svh;
}
.main-wrapper{
padding:8px;
padding-bottom:env(safe-area-inset-bottom, 8px);
}
.chat-wrapper{
border-radius:14px;
border-width:2px;
}
.chat-title{
font-size:14px;
padding:12px;
}
#chat-window{
padding:14px;
gap:10px;
}
.msg{
max-width:88%;
font-size:13.5px;
padding:10px 13px;
}
nav{
padding:10px 4%;
}
nav div{
font-size:13px;
}
.input-container{
padding:10px;
padding-bottom:max(10px, env(safe-area-inset-bottom));
gap:7px;
}
#user-input{
font-size:16px;
padding:10px 12px;
}
#send-btn{
padding:10px 14px;
font-size:13px;
}
}
</style>
</head>

<body>

<nav>
<a href="welcome.html" class="back-link">← Dashboard</a>
<div style="font-weight:800;">
KANASU <span style="color:var(--primary)">BEE HOUSE</span>
</div>
</nav>

<div class="main-wrapper">

<div class="chat-wrapper">

<div class="chat-title">
KANASU BEE CHATBOT 
</div>

<div id="chat-window">
<div class="msg bot-msg">
Hi, I'm Kanasu Bee..<br>
How can I help you today about bee keeping?
</div>
</div>

<div class="input-container">
<input type="text" id="user-input" placeholder="Ask about bee keeping..." autocomplete="off">
<button id="send-btn">Send</button>
</div>

</div>

</div>

<script>
const chatWindow=document.getElementById('chat-window');
const userInput=document.getElementById('user-input');
const sendBtn=document.getElementById('send-btn');

const SERVER_URL="https://kanasu-api.onrender.com/chat";

async function handleSend(){
const text=userInput.value.trim();
if(!text)return;

addMessage(text,'user-msg');
userInput.value='';

const typingDiv=document.createElement('div');
typingDiv.className='msg bot-msg';
typingDiv.id='typing';
typingDiv.innerHTML=`
<div class="typing-dots">
<span></span><span></span><span></span>
</div>
`;
chatWindow.appendChild(typingDiv);
scrollToBottom();

try{
const response=await fetch(SERVER_URL,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:text})
});

const data=await response.json();
document.getElementById('typing').remove();
addMessage(data.reply||"I'm sorry, I couldn't process that.",'bot-msg');

}catch(err){
document.getElementById('typing').remove();
addMessage("Error: Could not connect to hive server.",'bot-msg');
}
}

function addMessage(text,className){
const div=document.createElement('div');
div.className=`msg ${className}`;
div.innerText=text;
chatWindow.appendChild(div);
scrollToBottom();
}

function scrollToBottom(){
chatWindow.scrollTop=chatWindow.scrollHeight;
}

sendBtn.addEventListener('click',handleSend);
userInput.addEventListener('keypress',(e)=>{
if(e.key==='Enter')handleSend();
});
</script>

</body>
</html>
